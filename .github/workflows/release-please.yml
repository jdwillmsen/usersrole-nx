name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pushed with the default GITHUB_TOKEN, the release branch belongs to
      # github-actions[bot], and every pull_request run on it waits at
      # action_required for a manual approval, so the required "Main Job"
      # check never reports and the release PR cannot merge.
      - name: Require the release PR token
        run: |
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set, so the release PR's CI would wait for approval forever. Add the repository secret."
            exit 1
          fi
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PR_TOKEN }}
