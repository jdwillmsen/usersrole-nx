name: Deploy to Firebase Hosting on merge

# Until this existed, merging here changed the repository and nothing else:
# ci.yml has no deploy step, so users-role-nx.web.app kept serving whatever was
# built by hand last, and every merged dependency fix stopped at the default
# branch. Only hosting is deployed -- firebase.json also declares a functions
# codebase, and deploying that needs credentials and a billing account this
# workflow deliberately does not touch.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A queued deploy of an older commit must never land after a newer one.
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Built here rather than reusing a CI artifact: ci.yml runs `nx affected`,
      # so on a merge that touched nothing this app depends on it produces no
      # build to reuse, and the deploy would have nothing to publish.
      - run: npx nx build usersrole-nx --configuration=production

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_USERS_ROLE_NX }}
          channelId: live
          projectId: users-role-nx
          target: usersrole-nx
