name: Release

# Every commit that lands on main and passes CI is a release candidate.
# semantic-release reads the Conventional Commit history since the last tag and
# decides whether it amounts to a new version; if it does, it tags the commit,
# writes the GitHub release, and the deploy job below puts exactly that commit
# live. Nothing else deploys production, so users-role-nx.web.app is always a
# tagged, CI-green commit.
#
# Both halves of production move on that tag: the Cloud Functions go out first,
# through the Deploy Functions workflow, and Firebase Hosting only once they
# have. A release that stops half-way therefore leaves the old frontend calling
# the new API rather than a new frontend calling an API that never shipped.
#
# Chained off CI with workflow_run rather than running on push so a release can
# never race ahead of, or skip, the checks that gate it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# Serialized, never cancelled: a release that has tagged must finish its
# deploy, and two deploys finishing out of order would put an older version
# live. A newer run queued behind this one supersedes any older queued run,
# which is safe -- it releases everything the older one would have.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_run fires for every CI completion, including failures and pull
    # requests whose head branch happens to be called main (from a fork, say).
    # Only a green push to this repository's main is a release candidate.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # Tags and GitHub releases. Nothing else: the success and failure comments
      # that would need issues and pull-requests write are turned off in
      # .releaserc.json.
      contents: write
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-version: ${{ steps.release.outputs.new-release-version }}
    steps:
      # A tag is a promise that the version went live, and semantic-release
      # makes it before the deploy job ever runs. Without the Firebase service
      # account that deploy can only fail, leaving a release with nothing behind
      # it, so refuse to cut one. The secret is repository-wide, not scoped to
      # the production environment, which is why this job can see it at all.
      - name: Require the deploy credentials
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_USERS_ROLE_NX is not set, so the deploy would fail after tagging. Add the repository secret before releasing."
            exit 1
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_USERS_ROLE_NX }}
      # Under workflow_run, checkout defaults to the newest commit on main, not
      # the one CI just passed -- if main moved while CI ran, that would tag an
      # untested commit. Check out the exact commit CI ran against instead. If
      # main has since moved on, semantic-release sees the local branch is
      # behind and releases nothing; the newer commit's own CI run will.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The whole history and every tag: the next version is derived from
          # the commits since the last tag.
          fetch-depth: 0
          # semantic-release authenticates its tag push with GITHUB_TOKEN
          # itself; leaving checkout's credential in the git config is just a
          # second copy of it on disk.
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Nothing here runs Cypress, so skip downloading its binary.
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - id: release
        run: node tools/scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A release is cut from every releasable commit, most of which touch nothing
  # the functions bundle is built from, and redeploying unchanged functions
  # costs a Cloud Build run and a cold start for nothing. The paths are
  # everything that ends up in the bundle: the app itself, the one library it
  # imports, the script that rewrites the generated package.json, the
  # firebase.json entry naming the source directory and runtime, and the root
  # manifests the runtime dependency versions are copied out of -- so a
  # dependency release does redeploy the functions, which is how a security fix
  # reaches them at all.
  #
  # This sees one release's worth of history and nothing else, so it cannot
  # notice functions that were released before this deploy existed. Deploy
  # Functions' workflow_dispatch is what clears a backlog like that.
  plan-functions:
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.functions.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.release.outputs.new-release-version }}
          # Every tag: this compares the release against the one before it,
          # which a shallow clone cannot see.
          fetch-depth: 0
          persist-credentials: false
      - name: Work out whether the functions changed
        id: functions
        env:
          TAG: v${{ needs.release.outputs.new-release-version }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            changed=true
            reason="there is no earlier release tag, so nothing is known to be deployed"
          elif [ -n "$(git diff --name-only "$previous..$TAG" -- \
            apps/usersrole-nx-functions libs/shared firebase.json \
            tools/scripts/prepare-functions-deploy.mjs \
            package.json package-lock.json)" ]; then
            changed=true
            reason="something the functions bundle is built from changed since $previous"
          else
            changed=false
            reason="nothing the functions bundle is built from changed since $previous"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = true ]; then
            echo "Deploying the Cloud Functions: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped the Cloud Functions deploy: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Functions before hosting, so a release that stops half-way leaves the old
  # frontend calling the new API rather than a new frontend calling an API that
  # never shipped. A called workflow is a whole job, which is why what could
  # have been three steps is three jobs: the same deploy has to be runnable by
  # hand, and only a workflow of its own can carry workflow_dispatch.
  deploy-functions:
    needs: [release, plan-functions]
    if: needs.plan-functions.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-functions.yml
    with:
      tag: v${{ needs.release.outputs.new-release-version }}
    # Named rather than inherited, so the called workflow receives this one
    # secret and no other repository secret.
    secrets:
      FIREBASE_SERVICE_ACCOUNT_USERS_ROLE_NX: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_USERS_ROLE_NX }}

  deploy-hosting:
    needs: [release, plan-functions, deploy-functions]
    # Skipped is the ordinary case for deploy-functions, since most releases
    # change nothing the bundle is built from, and a skipped dependency would
    # otherwise skip hosting with it -- a frontend-only release would never
    # ship. Failed or cancelled must still stop hosting, which is the whole
    # point of the ordering.
    if: >-
      !cancelled() &&
      needs.plan-functions.result == 'success' &&
      (needs.deploy-functions.result == 'success' ||
      needs.deploy-functions.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://users-role-nx.web.app
    steps:
      # The tag, not the branch: what goes live is exactly what was released.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.release.outputs.new-release-version }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      # Built here rather than reusing a CI artifact: ci.yml runs `nx affected`,
      # so on a merge that touched nothing this app depends on it produces no
      # build to reuse, and the deploy would have nothing to publish.
      # package.json carries a placeholder version, because releases are tags
      # rather than commits back to main; APP_VERSION is what the About page
      # shows.
      - run: npx nx build usersrole-nx --configuration=production
        env:
          APP_VERSION: ${{ needs.release.outputs.new-release-version }}
      # No repoToken: it only feeds preview-channel pull request comments, and
      # this is the live channel.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_USERS_ROLE_NX }}
          channelId: live
          projectId: users-role-nx
          target: usersrole-nx
