name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}

jobs:
  main:
    name: Main Job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout [Pull Request]
        if: ${{ github.event_name == 'pull_request' }}
        with:
          # By default, PRs will be checked-out based on the Merge Commit, but we want the actual branch HEAD.
          ref: ${{ github.event.pull_request.head.sha }}
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0

      - uses: actions/checkout@v7
        name: Checkout [Default Branch]
        if: ${{ github.event_name != 'pull_request' }}
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0

      - name: Use the package manager cache if available
        uses: actions/setup-node@v7.0.0
        with:
          # Pinned via .nvmrc so CI and local resolve the same npm: a lockfile
          # written by npm 11 is not reproducible under the npm 10 that Node 22
          # ships, and npm ci rejects the mismatch.
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check out the default branch
        if: github.ref != 'refs/heads/main'
        run: git branch --track main origin/main

      # Release notes are only rendered on main after a merge; render them here
      # too so a dependency bump that breaks them fails its own pull request.
      - name: Check the release notes render
        run: node tools/scripts/check-release-notes.mjs

      - name: Run commands
        run: |
          npx nx format:check
          npx nx affected -t lint,test,build --parallel=4
          # Cypress component tests stay serial — parallel runs contend for the browser
          npx nx affected -t component-test --parallel=1
